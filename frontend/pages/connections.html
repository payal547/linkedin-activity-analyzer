<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Connections</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #f3f6f8;
        }

        .header {
            background: #0a66c2;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            font-size: 26px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .subtitle {
            color: #555;
            margin: 10px 0 25px;
        }

        .search-box {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .connections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .friend-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #0a66c2;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .friend-card h3 {
            margin-bottom: 8px;
        }

        .friend-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .select-btn {
            width: 100%;
            padding: 11px;
            background: #0a66c2;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .select-btn:hover {
            background: #004182;
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>LinkedIn Activity Analyzer</h1>
    </header>

    <div class="container">

        <h2>My Connections</h2>

        <p class="subtitle">
            Select a friend whose publicly available activity you want to analyze.
        </p>

        <input
            type="text"
            class="search-box"
            id="searchBox"
            placeholder="Search connection by name..."
            onkeyup="searchFriends()"
        >

        <div class="connections" id="connectionsList">

            <div class="friend-card">
                <div class="avatar">A</div>

                <h3>Sample Friend 1</h3>

                <p>AI/ML Enthusiast</p>

                <button class="select-btn"
                        onclick="selectFriend('Sample Friend 1')">
                    Select Friend
                </button>
            </div>

            <div class="friend-card">
                <div class="avatar">R</div>

                <h3>Sample Friend 2</h3>

                <p>Software Developer</p>

                <button class="select-btn"
                        onclick="selectFriend('Sample Friend 2')">
                    Select Friend
                </button>
            </div>

            <div class="friend-card">
                <div class="avatar">P</div>

                <h3>Sample Friend 3</h3>

                <p>Data Science Enthusiast</p>

                <button class="select-btn"
                        onclick="selectFriend('Sample Friend 3')">
                    Select Friend
                </button>
            </div>

        </div>

    </div>

    <script>
        function selectFriend(name) {
            localStorage.setItem("selectedFriend", name);
            window.location.href = "/activity-filter";
        }

        function searchFriends() {
            const search = document
                .getElementById("searchBox")
                .value
                .toLowerCase();

            const cards = document.querySelectorAll(".friend-card");

            cards.forEach(card => {
                const name = card
                    .querySelector("h3")
                    .textContent
                    .toLowerCase();

                card.style.display =
                    name.includes(search) ? "block" : "none";
            });
        }
    </script>

</body>
</html>
